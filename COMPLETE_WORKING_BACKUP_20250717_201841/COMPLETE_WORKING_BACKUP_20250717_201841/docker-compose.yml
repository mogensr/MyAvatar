version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: myavatar_postgres
    environment:
      POSTGRES_DB: myavatar
      POSTGRES_USER: myavatar_user
      POSTGRES_PASSWORD: myavatar_local_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myavatar_user -d myavatar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
