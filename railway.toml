[build]
builder = "NIXPACKS"

[deploy]
startCommand = "export LOG_LEVEL=debug && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --log-level debug"
healthcheckPath = "/"
healthcheckTimeout = 300
enableCors = true

[variables]
ENABLE_SAFE_MODE = "true"

[deploy.nixpacks]
aptPkgs = ["libgl1-mesa-glx", "libglib2.0-0", "libsm6", "libxext6", "libxrender1", "libfontconfig1"]
