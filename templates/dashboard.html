<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyAvatar</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .video-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .video-thumbnail {
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        .video-thumbnail video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-button:hover {
            background: rgba(0,0,0,0.9);
            transform: translate(-50%, -50%) scale(1.1);
        }
        .action-buttons {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            background: rgba(0,0,0,0.9);
        }
        .debug-info {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
            font-family: monospace;
        }
        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-completed {
            background: #10b981;
            color: white;
        }
        .status-processing {
            background: #f59e0b;
            color: white;
        }
        .status-failed {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold text-gray-900">🎭 MyAvatar Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600">Welcome, {{ user.username }}!</span>
                    <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Create New Video Section -->
        <div class="bg-white overflow-hidden shadow rounded-lg mb-8">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">
                    <i class="fas fa-plus-circle text-blue-500 mr-2"></i>Create New Video
                </h3>
                <a href="/create-video" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                    <i class="fas fa-video mr-2"></i>Start Creating
                </a>
            </div>
        </div>

        <!-- Recent Videos Section -->
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">
                        <i class="fas fa-history text-purple-500 mr-2"></i>Recent Videos
                    </h3>
                    <button onclick="refreshVideos()" class="text-sm text-blue-600 hover:text-blue-800">
                        <i class="fas fa-refresh mr-1"></i>Refresh
                    </button>
                </div>

                <!-- Videos Container -->
                <div id="videos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Videos will be loaded here -->
                    <div class="text-center py-8">
                        <i class="fas fa-spinner fa-spin text-gray-400 text-2xl mb-2"></i>
                        <p class="text-gray-500">Loading your videos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let videosData = [];

        // Load videos when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadVideos();
        });

        async function loadVideos() {
            try {
                console.log('🎬 Loading videos from API...');
                const response = await fetch('/api/completed-videos');
                const data = await response.json();
                
                console.log('📊 API Response:', data);
                
                if (data.videos && Array.isArray(data.videos)) {
                    videosData = data.videos;
                    displayVideos(videosData);
                } else {
                    displayNoVideos();
                }
            } catch (error) {
                console.error('❌ Error loading videos:', error);
                displayError();
            }
        }

        function displayVideos(videos) {
            const container = document.getElementById('videos-container');
            
            if (!videos || videos.length === 0) {
                displayNoVideos();
                return;
            }

            container.innerHTML = videos.map(video => createVideoCard(video)).join('');
        }

        function createVideoCard(video) {
            const hasVideoUrl = video.video_path && video.video_path !== 'None' && video.video_path.trim() !== '';
            const videoUrl = hasVideoUrl ? video.video_path : null;
            
            // Debug info for troubleshooting
            const debugInfo = `
                ID: ${video.id || 'N/A'}<br>
                HeyGen ID: ${video.heygen_video_id || 'N/A'}<br>
                Title: ${video.title || 'Untitled'}<br>
                Status: ${video.status || 'unknown'}<br>
                Video Path: ${video.video_path ? 'YES' : 'NO'}<br>
                Final ID Used: ${video.heygen_video_id || video.id || 'N/A'}
            `;

            return `
                <div class="video-card bg-white border border-gray-200 rounded-lg overflow-hidden">
                    <div class="video-thumbnail">
                        ${hasVideoUrl ? `
                            <!-- Video Preview -->
                            <video preload="metadata" muted>
                                <source src="${videoUrl}" type="video/mp4">
                            </video>
                            
                            <!-- Play Button -->
                            <button class="play-button" onclick="playVideo('${videoUrl}')" title="Play Video">
                                <i class="fas fa-play"></i>
                            </button>
                            
                            <!-- Action Buttons -->
                            <div class="action-buttons">
                                <button class="action-btn" onclick="downloadVideo('${videoUrl}', '${video.title || 'video'}')" title="Download">
                                    <i class="fas fa-download"></i>
                                </button>
                                <button class="action-btn" onclick="shareVideo('${videoUrl}')" title="Share">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        ` : `
                            <!-- Placeholder for no video -->
                            <div class="video-placeholder">
                                <i class="fas fa-video-slash"></i>
                            </div>
                        `}
                        
                        <!-- Status Badge -->
                        <div class="status-badge ${getStatusClass(video.status)}">
                            ${video.status || 'unknown'}
                        </div>
                    </div>
                    
                    <!-- Video Info -->
                    <div class="p-4">
                        <h4 class="font-semibold text-gray-900 mb-2">${video.title || 'Untitled Video'}</h4>
                        
                        <div class="flex items-center justify-between text-sm text-gray-500 mb-2">
                            <span>
                                <i class="fas fa-calendar mr-1"></i>
                                ${formatDate(video.created_at)}
                            </span>
                            <span>
                                <i class="fas fa-clock mr-1"></i>
                                ${formatTime(video.created_at)}
                            </span>
                        </div>
                        
                        <div class="text-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-gray-600">Status:</span>
                                <span class="font-medium ${getStatusTextClass(video.status)}">${video.status || 'unknown'}</span>
                            </div>
                            <div class="flex items-center justify-between mt-1">
                                <span class="text-gray-600">URL:</span>
                                <span class="font-medium ${hasVideoUrl ? 'text-green-600' : 'text-red-600'}">
                                    ${hasVideoUrl ? 'Available' : 'No'}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Debug Information -->
                        <div class="debug-info">
                            <strong>🔍 DEBUG:</strong><br>
                            ${debugInfo}
                        </div>
                    </div>
                </div>
            `;
        }

        function displayNoVideos() {
            const container = document.getElementById('videos-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <i class="fas fa-video text-gray-300 text-6xl mb-4"></i>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">No videos yet</h3>
                    <p class="text-gray-500 mb-4">Create your first AI avatar video to get started!</p>
                    <a href="/create-video" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                        <i class="fas fa-plus mr-2"></i>Create Video
                    </a>
                </div>
            `;
        }

        function displayError() {
            const container = document.getElementById('videos-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <i class="fas fa-exclamation-triangle text-red-300 text-6xl mb-4"></i>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">Error loading videos</h3>
                    <p class="text-gray-500 mb-4">There was a problem loading your videos. Please try again.</p>
                    <button onclick="loadVideos()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                        <i class="fas fa-refresh mr-2"></i>Try Again
                    </button>
                </div>
            `;
        }

        // Utility functions
        function getStatusClass(status) {
            switch(status) {
                case 'completed': return 'status-completed';
                case 'processing': return 'status-processing';
                case 'failed': return 'status-failed';
                default: return 'status-processing';
            }
        }

        function getStatusTextClass(status) {
            switch(status) {
                case 'completed': return 'text-green-600';
                case 'processing': return 'text-yellow-600';
                case 'failed': return 'text-red-600';
                default: return 'text-gray-600';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }

        function formatTime(dateString) {
            if (!dateString) return 'Unknown';
            const date = new Date(dateString);
            return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Video interaction functions
        function playVideo(videoUrl) {
            if (!videoUrl) {
                alert('Video URL not available');
                return;
            }
            
            console.log('🎬 Opening video in new tab:', videoUrl);
            window.open(videoUrl, '_blank');
        }

        function downloadVideo(videoUrl, title) {
            if (!videoUrl) {
                alert('Video URL not available for download');
                return;
            }
            
            console.log('📥 Downloading video:', videoUrl);
            
            // Create download link
            const link = document.createElement('a');
            link.href = videoUrl;
            link.download = `${title || 'video'}.mp4`;
            link.target = '_blank';
            
            // Trigger download
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function shareVideo(videoUrl) {
            if (!videoUrl) {
                alert('Video URL not available for sharing');
                return;
            }
            
            if (navigator.share) {
                navigator.share({
                    title: 'My AI Avatar Video',
                    text: 'Check out my AI-generated avatar video!',
                    url: videoUrl
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(videoUrl).then(() => {
                    alert('Video URL copied to clipboard!');
                }).catch(() => {
                    prompt('Copy this video URL:', videoUrl);
                });
            }
        }

        function refreshVideos() {
            console.log('🔄 Refreshing videos...');
            const container = document.getElementById('videos-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-8">
                    <i class="fas fa-spinner fa-spin text-gray-400 text-2xl mb-2"></i>
                    <p class="text-gray-500">Refreshing videos...</p>
                </div>
            `;
            loadVideos();
        }
    </script>
</body>
</html>
