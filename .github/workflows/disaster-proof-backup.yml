name: 🛡️ Disaster-Proof Backup System
on:
  push:
    branches: [ main, develop ]
  schedule:
    # Daily backup at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - incremental
        - emergency

jobs:
  disaster-proof-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for complete backup
          
      - name: 📊 Generate Backup Metadata
        id: metadata
        run: |
          echo "BACKUP_DATE=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "REPO_SIZE=$(du -sh . | cut -f1)" >> $GITHUB_OUTPUT
          
      - name: 🗂️ Create Structured Backup Archive
        run: |
          # Create backup directory structure
          mkdir -p backup_${{ steps.metadata.outputs.BACKUP_DATE }}
          
          # Core application files
          cp -r app/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/app/ 2>/dev/null || true
          cp -r templates/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/templates/ 2>/dev/null || true
          cp -r static/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/static/ 2>/dev/null || true
          cp -r portal/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/portal/ 2>/dev/null || true
          
          # Configuration files
          cp main.py backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          cp requirements.txt backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          cp .env.template backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          cp Dockerfile* backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          cp railway.toml backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          cp alembic.ini backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          
          # Database migrations
          cp -r alembic/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/alembic/ 2>/dev/null || true
          cp -r migrations/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/migrations/ 2>/dev/null || true
          
          # Documentation and configs
          cp *.md backup_${{ steps.metadata.outputs.BACKUP_DATE }}/ 2>/dev/null || true
          cp -r .github/ backup_${{ steps.metadata.outputs.BACKUP_DATE }}/.github/ 2>/dev/null || true
          
          # Create backup manifest
          cat > backup_${{ steps.metadata.outputs.BACKUP_DATE }}/BACKUP_MANIFEST.json << EOF
          {
            "backup_date": "${{ steps.metadata.outputs.BACKUP_DATE }}",
            "commit_hash": "${{ steps.metadata.outputs.COMMIT_HASH }}",
            "commit_short": "${{ steps.metadata.outputs.COMMIT_SHORT }}",
            "branch_name": "${{ steps.metadata.outputs.BRANCH_NAME }}",
            "repository_size": "${{ steps.metadata.outputs.REPO_SIZE }}",
            "backup_type": "${{ github.event.inputs.backup_type || 'scheduled' }}",
            "trigger": "${{ github.event_name }}",
            "workflow_run_id": "${{ github.run_id }}",
            "created_by": "GitHub Actions Disaster-Proof Backup",
            "restore_instructions": "Use git checkout ${{ steps.metadata.outputs.COMMIT_HASH }} or extract this archive to restore"
          }
          EOF
          
          # Create restore script
          cat > backup_${{ steps.metadata.outputs.BACKUP_DATE }}/RESTORE.sh << 'EOF'
          #!/bin/bash
          echo "🛡️ MyAvatar Disaster Recovery - Restore Script"
          echo "=============================================="
          echo "Backup Date: ${{ steps.metadata.outputs.BACKUP_DATE }}"
          echo "Commit Hash: ${{ steps.metadata.outputs.COMMIT_HASH }}"
          echo ""
          echo "OPTION 1: Git Restore (Recommended)"
          echo "git checkout ${{ steps.metadata.outputs.COMMIT_HASH }}"
          echo ""
          echo "OPTION 2: File Restore"
          echo "cp -r app/ ../app/"
          echo "cp -r templates/ ../templates/"
          echo "cp -r static/ ../static/"
          echo "cp -r portal/ ../portal/"
          echo "cp main.py ../"
          echo "cp requirements.txt ../"
          echo ""
          echo "OPTION 3: Complete Reset"
          echo "git reset --hard ${{ steps.metadata.outputs.COMMIT_HASH }}"
          echo "git push origin main --force"
          echo ""
          echo "⚠️  Always test in development environment first!"
          EOF
          
          chmod +x backup_${{ steps.metadata.outputs.BACKUP_DATE }}/RESTORE.sh
          
      - name: 📦 Create Compressed Archive
        run: |
          tar -czf MyAvatar_BACKUP_${{ steps.metadata.outputs.BACKUP_DATE }}_${{ steps.metadata.outputs.COMMIT_SHORT }}.tar.gz backup_${{ steps.metadata.outputs.BACKUP_DATE }}/
          
      - name: 📤 Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAvatar-Backup-${{ steps.metadata.outputs.BACKUP_DATE }}-${{ steps.metadata.outputs.COMMIT_SHORT }}
          path: MyAvatar_BACKUP_${{ steps.metadata.outputs.BACKUP_DATE }}_${{ steps.metadata.outputs.COMMIT_SHORT }}.tar.gz
          retention-days: 90
          
      - name: 🔍 Backup Verification
        run: |
          echo "🔍 Verifying backup integrity..."
          
          # Test archive extraction
          mkdir test_restore
          tar -xzf MyAvatar_BACKUP_${{ steps.metadata.outputs.BACKUP_DATE }}_${{ steps.metadata.outputs.COMMIT_SHORT }}.tar.gz -C test_restore
          
          # Verify critical files exist
          CRITICAL_FILES=(
            "backup_${{ steps.metadata.outputs.BACKUP_DATE }}/main.py"
            "backup_${{ steps.metadata.outputs.BACKUP_DATE }}/requirements.txt"
            "backup_${{ steps.metadata.outputs.BACKUP_DATE }}/BACKUP_MANIFEST.json"
            "backup_${{ steps.metadata.outputs.BACKUP_DATE }}/RESTORE.sh"
          )
          
          for file in "${CRITICAL_FILES[@]}"; do
            if [[ -f "test_restore/$file" ]]; then
              echo "✅ $file - OK"
            else
              echo "❌ $file - MISSING"
              exit 1
            fi
          done
          
          echo "✅ Backup verification successful!"
          
      - name: 📊 Backup Report
        run: |
          echo "## 🛡️ Disaster-Proof Backup Report" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Backup Date | ${{ steps.metadata.outputs.BACKUP_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Commit Hash | \`${{ steps.metadata.outputs.COMMIT_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | ${{ steps.metadata.outputs.BRANCH_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Repository Size | ${{ steps.metadata.outputs.REPO_SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Backup Type | ${{ github.event.inputs.backup_type || 'scheduled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Status | SUCCESS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Quick Restore Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Git restore (recommended)" >> $GITHUB_STEP_SUMMARY
          echo "git checkout ${{ steps.metadata.outputs.COMMIT_HASH }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Force reset (nuclear option)" >> $GITHUB_STEP_SUMMARY
          echo "git reset --hard ${{ steps.metadata.outputs.COMMIT_HASH }}" >> $GITHUB_STEP_SUMMARY
          echo "git push origin main --force" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  backup-notification:
    needs: disaster-proof-backup
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: 🚨 Backup Failure Alert
        run: |
          echo "🚨 CRITICAL: Disaster-Proof Backup FAILED!"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.run_id }}"
          echo ""
          echo "⚠️ IMMEDIATE ACTION REQUIRED:"
          echo "1. Check workflow logs"
          echo "2. Verify backup system integrity"
          echo "3. Run manual backup if needed"
          exit 1
